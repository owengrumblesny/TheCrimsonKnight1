; Crimson Knight export presets (Godot 4.7.2). Build with build/build_windows.ps1 or build/build_linux.sh;
; see docs/BUILD.md. The R.E.D. ai/ folder is not packed: the build scripts copy it next to the executable.
;
; include_filter adds the plain JSON data read at runtime with FileAccess (config/, godot/data/, the UI pack's
; config/); everything else the game loads is an imported resource and comes in through "all_resources".

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="res://config/*.json, res://godot/data/*.json, res://CRIMSON_KNIGHT_UI_PACK/config/*.json"
exclude_filter="res://game/*, res://docs/*, res://tools/*, res://node_modules/*, res://ai/*, res://ai_linux/*, res://.claude/*, res://assets/source/*, res://godot/tools/*, res://build/*, res://dist/*, res://legacy_v03/*, res://references/*"
export_path="dist/windows/CrimsonKnight.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://build/icon/crimson_knight.ico"
application/console_wrapper_icon="res://build/icon/crimson_knight.ico"
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="Owen Enterprises"
application/product_name="Crimson Knight"
application/file_description="Crimson Knight: Earth-RED"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false

[preset.1]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="res://config/*.json, res://godot/data/*.json, res://CRIMSON_KNIGHT_UI_PACK/config/*.json"
exclude_filter="res://game/*, res://docs/*, res://tools/*, res://node_modules/*, res://ai/*, res://ai_linux/*, res://.claude/*, res://assets/source/*, res://godot/tools/*, res://build/*, res://dist/*, res://legacy_v03/*, res://references/*"
export_path="dist/linux/CrimsonKnight.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
