<!doctype html><html lang="en"><meta charset="utf-8"><title>Crimson Knight — Asset Preview</title><style>body{margin:0;background:#090b11;color:#eee;font:14px system-ui}#bar{position:fixed;z-index:2;top:10px;left:10px;background:#14151c;padding:15px;border:1px solid #9b2532}button,select{background:#45121d;color:white;border:1px solid #ab394b;padding:8px;margin:3px}canvas{display:block}</style><div id="bar"><b>OWEN ENTERPRISES // ASSET VIEWER</b><p>Orbit: drag · Zoom: wheel</p><select id="model"><option value="crimson_knight_CRX9">CR-X9 War Suit</option><option value="CRX1_interceptor">CR-X1 Interceptor</option><option value="CRB1_batcycle">CR-B1 Batcycle</option><option value="CRA1_specter">CR-A1 Specter</option></select><select id="motion"><option>idle</option><option>walk</option><option>run</option><option>sprint</option><option>crouch</option><option>glide</option><option>grapple</option><option>gadget_deploy</option></select><p style="max-width:270px">Low-poly geometry blockouts. Animation is a rigid-part procedural preview, not a production character rig.</p></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/loaders/GLTFLoader.js';
import {createPreviewAnimator} from './animation/preview_animator.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#0a0b12');const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1000);camera.position.set(7,5,10);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.5,0);orbit.update();scene.add(new THREE.HemisphereLight(0xc4d2ef,0x29222c,2));const light=new THREE.DirectionalLight(0xffffff,2.3);light.position.set(8,12,6);scene.add(light);const red=new THREE.PointLight(0xff163b,65,20);red.position.set(-5,5,-4);scene.add(red);scene.add(new THREE.GridHelper(30,30,0x9c2a3a,0x303039));let obj,anim;const loader=new GLTFLoader();function load(){if(obj)scene.remove(obj);loader.load('./models/'+document.querySelector('#model').value+'.glb',g=>{obj=g.scene;scene.add(obj);anim=createPreviewAnimator(obj);anim.setMode(document.querySelector('#motion').value);},undefined,e=>alert('Failed to load GLB: '+e.message))}document.querySelector('#model').onchange=load;document.querySelector('#motion').onchange=()=>anim?.setMode(document.querySelector('#motion').value);load();const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);anim?.update(clock.getDelta());renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
